amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    scan_topic: "/scan"
    laser_model_type: "likelihood_field"
    max_particles: 2000
    min_particles: 500
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0

    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"

      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.22
      max_angular_vel: 0.8
      rotate_to_heading_angular_vel: 0.8

      lookahead_dist: 0.45
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.7

      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6

      transform_tolerance: 0.2

      regulate_linear_velocity_scaling: true
      regulate_linear_velocity_scaling_min_radius: 0.9
      regulate_linear_velocity_scaling_min_speed: 0.08

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

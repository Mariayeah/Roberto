<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROS2 Web Topics Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <style>
        .control-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; }
        .control-grid .btn { height: 60px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Control de Robot Web con ROS2</h1>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h3 class="card-title">Conexión</h3>
                        <div class="mb-3">
                            <label for="ws_url" class="form-label text-muted small">Dirección rosbridge_server:</label>
                            <div class="input-group">
                                <span class="input-group-text">wss://</span>
                                <input type="text" class="form-control" id="ws_url" value="127.0.0.1:9090">
                            </div>
                        </div>
                        <button class="btn btn-success w-100 mb-2" id="btn_connect">Conectar a ROS</button>
                        <button class="btn btn-danger w-100" id="btn_disconnect" disabled>Desconectar</button>
                        <p class="mt-3 mb-0 fw-bold text-center">
                            Estado: <span id="status" class="text-danger">Desconectado</span>
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h2 class="card-title text-center">Panel de Control</h2>
                        
                        <h5 class="mt-4 text-center">Control Manual</h5>
                        <div class="control-grid mt-3">
                            <div></div>
                            <button class="btn btn-outline-primary" id="btn_forward">▲</button>
                            <div></div>
                            
                            <button class="btn btn-outline-primary" id="btn_left">◀</button>
                            <button class="btn btn-danger" id="btn_stop">STOP</button>
                            <button class="btn btn-outline-primary" id="btn_right">▶</button>
                            
                            <div></div>
                            <button class="btn btn-outline-primary" id="btn_back">▼</button>
                            <div></div>
                        </div>
                        
                        <hr>

                        <h5 class="mt-4">Modo Jaula Virtual</h5>
                        <p class="text-muted small">Límites: X (-2.5 a -1.5) | Y (-1.5 a -0.5)</p>
                        <button class="mt-2 btn btn-warning" id="btn_cage_on">Activar Jaula</button>
                        <button class="mt-2 btn btn-secondary" id="btn_cage_off">Desactivar Jaula</button>
                        <button class="mt-2 btn btn-success" id="btn_cage_start" disabled>Iniciar Marcha</button>
                        <p class="mt-2 fw-bold">Estado Jaula: <span id="cage_status" class="text-secondary">Desactivada</span></p>
                    </div>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-body text-center">
                        <h5 class="card-title mb-3">Cámara en Tiempo Real</h5>
                        <div id="divCamera" class="bg-dark rounded p-1 d-inline-block" style="min-width: 320px; min-height: 240px;">
                            <img id="cameraFeed" src="" alt="Esperando conexión..." class="img-fluid rounded" style="max-height: 400px;">
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Datos de Odometría (/odom)</h5>
                        <div class="row text-center mt-3">
                            <div class="col"><span class="fw-bold">X:</span> <span id="pos_x" class="fs-5">0.00</span></div>
                            <div class="col"><span class="fw-bold">Y:</span> <span id="pos_y" class="fs-5">0.00</span></div>
                            <div class="col"><span class="fw-bold">Yaw (θ):</span> <span id="pos_theta" class="fs-5">0.00</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
